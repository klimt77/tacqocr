<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TACQOCR v5</title>
</head>
<body style="background:#0F1A1F;color:white;font-family:sans-serif;padding:20px;max-width:430px;margin:0 auto">
<h2>TACQOCR v5</h2>
<p id="model" style="color:#62E87C"></p>
<input id="key" type="password" placeholder="Gemini API key" style="width:100%;padding:10px;margin:10px 0;background:#162028;border:1px solid #243340;color:white;border-radius:8px">
<button onclick="saveKey()" style="background:#62E87C;border:none;padding:10px 20px;border-radius:8px;font-weight:bold;cursor:pointer">Save key</button>
<p id="keyStatus" style="color:#62E87C;margin:10px 0"></p>
<input type="file" id="fileInput" accept="image/*" style="margin:10px 0">
<br>
<button onclick="analyse()" style="background:#62E87C;border:none;padding:14px;border-radius:8px;font-weight:bold;cursor:pointer;width:100%;margin:10px 0">Analyse invoice</button>
<p id="status"></p>
<pre id="result" style="background:#162028;padding:10px;border-radius:8px;white-space:pre-wrap;font-size:12px"></pre>
<script>
const MODEL = 'gemini-1.5-flash';
const URL_BASE = 'https://generativelanguage.googleapis.com/v1/models/' + MODEL + ':generateContent?key=';
document.getElementById('model').textContent = 'Model: ' + MODEL;

function saveKey() {
  var k = document.getElementById('key').value.trim();
  if (!k) return;
  localStorage.setItem('tq_key_v5', k);
  document.getElementById('keyStatus').textContent = 'Key saved';
}

async function analyse() {
  var key = localStorage.getItem('tq_key_v5');
  if (!key) { alert('Enter and save your key first'); return; }
  var file = document.getElementById('fileInput').files[0];
  if (!file) { alert('Select a file first'); return; }
  document.getElementById('status').textContent = 'Analysing...';
  var b64 = await toBase64(file);
  var mime = file.type || 'image/jpeg';
  try {
    var res = await fetch(URL_BASE + key, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({contents:[{parts:[
        {inline_data:{mime_type:mime,data:b64}},
        {text:'Extract invoice data and return JSON with fields: invoice_number, date, supplier_name, total_ttc, currency'}
      ]}]})
    });
    var data = await res.json();
    if (!res.ok) throw new Error(JSON.stringify(data.error));
    var text = data.candidates[0].content.parts[0].text;
    document.getElementById('result').textContent = text;
    document.getElementById('status').textContent = 'Done';
  } catch(e) {
    document.getElementById('status').textContent = 'Error: ' + e.message;
  }
}

function toBase64(f) {
  return new Promise(function(res,rej){
    var r = new FileReader();
    r.onload = function(){ res(r.result.split(',')[1]); };
    r.onerror = rej;
    r.readAsDataURL(f);
  });
}
</script>
</body>
</html>
